<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --ink:#2a1a1a; --muted:#7a5f5f; --line:#ecd9cf;
  --red:#b3202a; --green:#1d5a3a; --gold:#c8963a; --ph:#f6ece4;
  --hero1:#8f1620; --hero2:#b3202a; --hero-ink:#fff8ee; --tab-on-ink:#fff; --pill-on-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14201a; --card:#1d2e25; --ink:#f7efe4; --muted:#b9a99a; --line:#34493d;
    --red:#ff7a80; --green:#7fd1a0; --gold:#e8c06a; --ph:#26392f;
    --hero1:#6e1119; --hero2:#951b25; --tab-on-ink:#10241c; --pill-on-ink:#10241c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;position:relative;min-height:100vh}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow i{position:absolute;top:-24px;color:var(--gold);opacity:.55;font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.snow{display:none}}
.topbar,header,.tabs,main,footer{position:relative;z-index:1}
.topbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar a{color:var(--muted);text-decoration:none;font-weight:600;padding:6px 14px;border-radius:999px}
.topbar a:hover{color:var(--ink)}
.topbar a[aria-current="page"]{background:var(--red);color:var(--pill-on-ink)}
header{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);text-align:center;padding:44px 20px 40px;border-bottom:6px solid var(--gold)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:6px;background:repeating-linear-gradient(135deg,var(--green) 0 14px,#fff8ee 14px 28px)}
.lights{letter-spacing:.5em;font-size:1.1rem;margin-bottom:8px}
h1{font:600 clamp(2rem,6vw,3.4rem)/1.1 Georgia,"Times New Roman",serif;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;opacity:.92}
.tabs{max-width:1000px;margin:36px auto 0;padding:0 20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:999px;color:var(--muted);padding:10px 22px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--tab-on-ink)}
.tabs button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:36px 20px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.item{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(120,30,30,.08);transition:transform .15s}
.item:nth-child(even){border-top-color:var(--green)}
.item:hover{transform:translateY(-3px);border-color:var(--gold)}
.pic{aspect-ratio:1/1;background:var(--ph);display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.pic span{color:var(--muted);font-size:.85rem;padding:12px;text-align:center}
.meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.name{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.store{color:var(--muted);font-size:.85rem}
.note{color:var(--red);font-size:.85rem;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:2px dashed var(--line);border-radius:12px;background:var(--card)}
.empty b{display:block;font-size:2rem;margin-bottom:6px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.person{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:14px;padding:28px 16px;text-align:center;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(120,30,30,.08);transition:transform .15s}
.person:nth-child(even){border-top-color:var(--green)}
.person:hover{transform:translateY(-3px);border-color:var(--gold)}
.person .em{font-size:2.6rem;display:block}
.person .pn{font:600 1.5rem Georgia,serif;margin:6px 0 2px}
.person .ct{color:var(--muted);font-size:.9rem}
footer{text-align:center;padding:0 20px 40px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>

const lush = name => ({ name, store:"Lush", url:"https://www.lush.com/us/en_us/search?q="+encodeURIComponent(name) });
const find = (name, store, base, q, note) => ({ name, store, url: base + encodeURIComponent(q), note });
const AMZ = "https://www.amazon.com/s?k=";
const amz = (asin, name) => ({ name, url:`https://www.amazon.com/dp/${asin}`, store:"Amazon", asin });
const cacheGet = k => { try { return JSON.parse(localStorage.getItem("xmas26:"+k)); } catch(e){ return null; } };
const cacheSet = (k,v) => { try { localStorage.setItem("xmas26:"+k, JSON.stringify(v)); } catch(e){} };
const amazonImg = asin => `https://ws-na.amazon-adsystem.com/widgets/q?_encoding=UTF8&ASIN=${asin}&Format=_SL500_&ID=AsinImage&MarketPlace=US&ServiceVersion=20070822&WS=1`;
const clean = t => t.replace(/^Amazon\.com\s*:\s*/i,"");
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };

async function preview(url){
  const hit = cacheGet(url);
  if (hit) return hit;
  const r = await fetch("https://api.microlink.io/?url=" + encodeURIComponent(url));
  const j = await r.json();
  const out = { image: j.data && j.data.image && j.data.image.url, title: j.data && j.data.title };
  if (out.image) cacheSet(url, out);
  return out;
}

function card(it){
  const a = el("a","item"); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = '<div class="pic"><span>Loading image…</span></div><div class="meta"><div class="name"></div><div class="store"></div><div class="note" hidden></div></div>';
  const pic = a.querySelector(".pic"), nm = a.querySelector(".name");
  nm.textContent = it.name || "Amazon item";
  a.querySelector(".store").textContent = it.store;
  if (it.note){ const n = a.querySelector(".note"); n.textContent = it.note; n.hidden = false; }
  let tried = false;
  const show = src => {
    const img = new Image();
    img.alt = it.name || "Product image";
    img.referrerPolicy = "no-referrer";
    img.onload = () => { if (img.naturalWidth > 1) pic.replaceChildren(img); else fallback(); };
    img.onerror = fallback;
    img.src = src;
  };
  const fallback = async () => {
    if (tried) { pic.innerHTML = "<span>Image unavailable. Tap to open the store page.</span>"; return; }
    tried = true;
    try {
      const p = await preview(it.url);
      if (!it.name && p.title) nm.textContent = clean(p.title);
      if (p.image) return show(p.image);
    } catch(e){}
    fallback();
  };
  if (it.asin) {
    show(amazonImg(it.asin));
    if (!it.name) preview(it.url).then(p => { if (p.title) nm.textContent = clean(p.title); }).catch(()=>{});
  } else fallback();
  return a;
}

function grid(items){
  if (!items.length){
    const d = el("div","empty"); d.innerHTML = "<b>🎁</b>No gifts added yet."; return d;
  }
  const g = el("div","grid");
  items.forEach(it => g.appendChild(card(it)));
  return g;
}

      find("Bitty Baby High Chair", "Amazon", AMZ, "bitty baby high chair", undefined),
      find("Bitty Baby Crib", "Amazon", AMZ, "bitty baby crib", undefined),
      find("Bitty Baby Stroller", "Amazon", AMZ, "bitty baby stroller", undefined),
      find("Bitty Baby Play Food", "Amazon", AMZ, "bitty baby play food accessories", undefined),
      find("Silk Sheets for Her Bed", "Amazon", AMZ, "silk sheet set toddler bed", "Protects her hair"),
      find("Toddler Kitchen Apron", "Amazon", AMZ, "toddler apron kitchen helper", "Nora-sized, for kitchen help"),
      find("Miss Mouth’s Messy Eater Stain Remover", "Amazon", AMZ, "miss mouth's messy eater stain remover", undefined)
    ] } ] }
};

const snow = el("div","snow"); snow.setAttribute("aria-hidden","true");
for (let i=0;i<22;i++){
  const f = el("i","", i%3 ? "❄" : "✦");
  f.style.left = Math.random()*100+"%";
  f.style.fontSize = (10+Math.random()*14)+"px";
  f.style.animationDuration = (9+Math.random()*12)+"s";
  f.style.animationDelay = (-Math.random()*20)+"s";
  snow.appendChild(f);
}

let current = (function(){ try { return location.hash.replace("#","") || "ethan"; } catch(e){ return "ethan"; } })();
function go(id){
  current = id;
  try { history.replaceState(null,"", id ? "#"+id : location.pathname + location.search); } catch(e){}
  render();
}
function render(){
  const id = current;
  const P = PAGES[id], home = !P;
  document.body.replaceChildren(snow);
  document.title = home ? "2026 Christmas Lists" : P.title;

  const bar = el("nav","topbar"); bar.setAttribute("aria-label","Pages");
  [{id:"",name:"🏠 Home"}, ...PEOPLE.map(p => ({id:p.id, name:p.em+" "+p.name}))].forEach(l => {
    const a = el("a","",l.name); a.href = "#"+l.id; a.onclick = e => { e.preventDefault(); go(l.id); };
    if (l.id === (home ? "" : id)) a.setAttribute("aria-current","page");
    bar.appendChild(a);
  });

  const head = el("header");
  head.innerHTML = '<div class="lights" aria-hidden="true">🎄 ✨ 🎁 ✨ 🎄</div>';
  head.append(el("h1","", home ? "2026 Christmas Lists" : P.title), el("p","", home ? "Pick a name to see their list." : TAG));
  const main = el("main");
  document.body.append(bar, head);

  if (home){
    const w = el("div","people");
    PEOPLE.forEach(p => {
      const a = el("a","person"); a.href = "#"+p.id; a.onclick = e => { e.preventDefault(); go(p.id); };
      a.append(el("span","em",p.em), el("div","pn",p.name), el("div","ct","View list →"));
      w.appendChild(a);
    });
    main.appendChild(w); document.body.appendChild(main);
  } else if (P.lists.length > 1){
    const tabs = el("div","tabs"); tabs.setAttribute("role","tablist");
    const panels = [];
    P.lists.forEach((l,i) => {
      const b = el("button","",l.label); b.setAttribute("role","tab"); b.setAttribute("aria-selected", i===0);
      const pn = el("section"); pn.setAttribute("role","tabpanel"); pn.hidden = i!==0; pn.appendChild(grid(l.items));
      b.onclick = () => [...tabs.children].forEach((x,j) => { x.setAttribute("aria-selected", j===i); panels[j].hidden = j!==i; });
      tabs.appendChild(b); panels.push(pn); main.appendChild(pn);
    });
    document.body.append(tabs, main);
  } else {
    main.appendChild(grid(P.lists[0].items)); document.body.appendChild(main);
  }
  document.body.appendChild(el("footer","","Merry Christmas! 🎄"));
  window.scrollTo(0,0);
}
addEventListener("hashchange", () => { try { current = location.hash.replace("#","") || current; } catch(e){} render(); });
render();
</script>
